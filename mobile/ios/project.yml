name: WakuMobile
options:
  bundleIdPrefix: dev.waku
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""

targets:
  WakuMobile:
    type: application
    platform: iOS
    sources:
      - path: main.m
        type: file
        buildPhase: sources
      - path: gpui_ios.h
        type: file
        buildPhase: headers
      - path: LaunchScreen.storyboard
        type: file
        buildPhase: resources
      - path: Assets.xcassets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.waku.mobile
        PRODUCT_NAME: Waku
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_BITCODE: NO
        # Xcode 16 debug dylib executor can't load a statically-linked Rust
        # library, so keep the static link path.
        ENABLE_DEBUG_DYLIB: NO
        OTHER_LINK_BINARY_WITH_LIBRARIES_SECTION_TYPE: static
        DEAD_CODE_STRIPPING: NO
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(WAKU_STATIC_LIB)"
          - "-lc++"
          - "-framework UIKit"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework QuartzCore"
          - "-framework CoreGraphics"
          - "-framework CoreText"
          - "-framework CoreFoundation"
          - "-framework Foundation"
          - "-framework Security"
          - "-framework SystemConfiguration"
          - "-framework AudioToolbox"
          - "-framework WebKit"
          - "-framework CoreMedia"
          - "-framework AVFoundation"
          - "-framework LocalAuthentication"
          - "-framework Contacts"
          - "-framework EventKit"
          - "-framework StoreKit"
          - "-framework CoreMotion"
          - "-framework Network"
          - "-ObjC"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "USE_GPUI_RUST=1"
          - "$(inherited)"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)"
        VALID_ARCHS: "arm64"
        ARCHS: "arm64"
        ONLY_ACTIVE_ARCH: YES
        # SDK-conditional static lib path: simulator uses aarch64-apple-ios-sim,
        # device uses aarch64-apple-ios. Debug points at debug artifacts; the
        # Release config below overrides with release artifacts.
        "WAKU_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/debug/libwaku_mobile.a"
        "WAKU_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios/debug/libwaku_mobile.a"
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: "0"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          "WAKU_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/release/libwaku_mobile.a"
          "WAKU_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios/release/libwaku_mobile.a"
          GCC_OPTIMIZATION_LEVEL: "s"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    preBuildScripts:
      - name: "Build Rust Static Library"
        script: |
          set -euo pipefail

          RUST_PROJECT_DIR="${PROJECT_DIR}/.."
          cd "${RUST_PROJECT_DIR}"

          if [ "${PLATFORM_NAME}" = "iphonesimulator" ]; then
            RUST_TARGET="aarch64-apple-ios-sim"
          else
            RUST_TARGET="aarch64-apple-ios"
          fi

          if [ "${CONFIGURATION}" = "Release" ]; then
            CARGO_FLAGS="--release"
          else
            CARGO_FLAGS=""
          fi

          echo "Building waku-mobile for ${RUST_TARGET} (${CONFIGURATION})..."
          rustup target add "${RUST_TARGET}" 2>/dev/null || true
          cargo build --target "${RUST_TARGET}" ${CARGO_FLAGS}
        shell: /bin/bash
        basedOnDependencyAnalysis: false
